<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek API 调用 - 普通 vs 流式</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #333;
        }

        h2 {
            margin-bottom: 0.5rem;
        }

        .warning {
            color: #d9534f;
            font-size: 0.85em;
            background: #fdf2f2;
            border-left: 3px solid #d9534f;
            padding: 8px 12px;
            margin-bottom: 1rem;
            border-radius: 4px;
        }

        .mode-switch {
            display: flex;
            gap: 0;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            width: fit-content;
        }

        .mode-switch button {
            padding: 8px 20px;
            border: none;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 0.95em;
            transition: background 0.2s;
        }

        .mode-switch button.active {
            background: #007bff;
            color: white;
        }

        .mode-switch button:not(.active):hover {
            background: #e8e8e8;
        }

        textarea {
            width: 100%;
            height: 80px;
            margin-bottom: 1rem;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1em;
            resize: vertical;
        }

        .btn-send {
            padding: 10px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }

        .btn-send:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .response-box {
            margin-top: 1.2rem;
            padding: 1rem;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 80px;
            line-height: 1.6;
        }

        .status {
            font-size: 0.85em;
            color: #888;
            margin-top: 0.5rem;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #333;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <h2>DeepSeek API 调用测试</h2>
    <div class="warning">
        ⚠️ 在前端直接暴露 API Key 仅用于本地测试。生产环境请通过你自己的后端服务器转发请求。
    </div>

    <!-- 模式切换 -->
    <div class="mode-switch">
        <button id="btnNormal" class="active" onclick="setMode(false)">普通回答</button>
        <button id="btnStream" onclick="setMode(true)">流式回答</button>
    </div>

    <textarea id="promptInput" placeholder="请输入你的问题...">请用三句话介绍一下你自己。</textarea>
    <button id="sendBtn" class="btn-send" onclick="sendRequest()">发送请求</button>

    <div id="status" class="status"></div>
    <div id="response" class="response-box">等待响应...</div>

    <script>
        // ========== 配置 ==========
        const API_KEY = ''; // 替换成你的真实 Key，勿提交到仓库
        const API_URL = 'https://api.deepseek.com/chat/completions';
        const MODEL = 'deepseek-chat'; // 或 deepseek-flash，以官方文档为准

        // ========== 状态 ==========
        let isStreamMode = false; // 当前模式：false=普通, true=流式
        let isRequesting = false;

        // 切换模式
        function setMode(stream) {
            if (isRequesting) {
                alert('请求进行中，请等待完成后再切换模式');
                return;
            }
            isStreamMode = stream;
            document.getElementById('btnNormal').classList.toggle('active', !stream);
            document.getElementById('btnStream').classList.toggle('active', stream);
        }

        // 发送请求入口
        async function sendRequest() {
            if (isRequesting) return;

            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                alert('请输入内容');
                return;
            }

            const responseDiv = document.getElementById('response');
            const statusDiv = document.getElementById('status');
            const sendBtn = document.getElementById('sendBtn');

            isRequesting = true;
            sendBtn.disabled = true;
            responseDiv.textContent = '';
            statusDiv.textContent = isStreamMode ? '流式请求中...' : '请求中...';

            try {
                if (isStreamMode) {
                    await callStream(prompt, responseDiv);
                } else {
                    await callNormal(prompt, responseDiv);
                }
                statusDiv.textContent = '✅ 完成';
            } catch (error) {
                console.error(error);
                responseDiv.textContent = '请求失败：' + error.message;
                statusDiv.textContent = '❌ 失败';
            } finally {
                isRequesting = false;
                sendBtn.disabled = false;
            }
        }

        // ========== 普通调用（非流式） ==========
        async function callNormal(prompt, responseDiv) {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [{ role: 'user', content: prompt }],
                    stream: false
                })
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`HTTP ${res.status}: ${errText}`);
            }

            const data = await res.json();
            const content = data.choices?.[0]?.message?.content;
            responseDiv.textContent = content || '未解析到内容：\n' + JSON.stringify(data, null, 2);
        }

        // ========== 流式调用（SSE） ==========
        async function callStream(prompt, responseDiv) {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [{ role: 'user', content: prompt }],
                    stream: true
                })
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`HTTP ${res.status}: ${errText}`);
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = ''; // 用于处理跨 chunk 的不完整行

            // 创建光标元素，实现打字机效果
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            responseDiv.appendChild(cursor);

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });

                // SSE 以换行分隔事件，按行处理
                const lines = buffer.split('\n');
                // 最后一行可能不完整，保留到下一次处理
                buffer = lines.pop() || '';

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed.startsWith('data:')) continue;

                    const jsonStr = trimmed.slice(5).trim(); // 去掉 "data:"
                    if (!jsonStr || jsonStr === '[DONE]') continue;

                    try {
                        const data = JSON.parse(jsonStr);
                        const content = data.choices?.[0]?.delta?.content;
                        if (content) {
                            // 在光标前插入新文字
                            cursor.insertAdjacentText('beforebegin', content);
                        }
                    } catch (e) {
                        // 忽略无法解析的片段
                    }
                }
            }

            // 流结束，移除光标
            cursor.remove();
        }
    </script>
</body>

<script>
    /**
     * 配置名称     DeepSeek
     * Provider    DeepSeek (深度求索)
     * Base URL    https://api.deepseek.com/v1
     * Model       deepseek-flash
     * API Key     见 server/.env，勿提交到仓库
    */

    /**
     * 配置名称     Agnes
     * Provider    agnes (智能体)
     * Base URL    https://api.agnes-ai.cn/v1
     * Model       agnes-3.0-flash
     * API Key     见 server/.env，勿提交到仓库
    */

    /**
     * 配置名称     doubao-chat
     * Provider    Doubao
     * Base URL    https://ark.cn-beijing.volces.com/api/v3
     * Model       doubao-seed-evolving
     * API Key     见 server/.env，勿提交到仓库
    */
</script>

</html>
